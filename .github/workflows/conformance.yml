name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  conformance:
    name: Conformance (2026-07-28 and 2025-11-25)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PowerShell 7.4
        uses: ./.github/actions/install-pwsh
        with:
          version: '7.4.20'
      - name: Node.js version
        run: node --version && npm --version
      - name: Run the conformance suite (server and client legs of both requirement sets)
        shell: pwsh
        run: ./build.ps1 -Bootstrap -Task Conformance
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: output/conformance/
          if-no-files-found: warn
