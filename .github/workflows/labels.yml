name: Sync issue labels

# Creates or updates the repository labels from .github/labels.json (the label taxonomy of the MCP SDK tiering
# guidelines plus repository-specific labels). Runs on demand and whenever the file changes on main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/labels.json']

permissions:
  issues: write

jobs:
  sync:
    name: Create or update labels
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -c '.[]' .github/labels.json | while read -r label; do
            name=$(jq -r '.name' <<< "$label")
            color=$(jq -r '.color' <<< "$label")
            description=$(jq -r '.description' <<< "$label")
            gh label create "$name" --color "$color" --description "$description" --force
            echo "synced: $name"
          done
