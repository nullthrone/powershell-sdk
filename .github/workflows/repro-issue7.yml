# TEMPORARY (issue #7): repeated runs of the flaky HTTP cancellation test; removed before the fix PR.
name: Repro issue 7

on:
  push:
    branches: [claude/vigilant-shannon-oubi04]

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  repro:
    name: Repro (${{ matrix.os }}, pwsh ${{ matrix.pwsh }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        pwsh: ['7.4.20', '7.5.11', '7.6.6']
        include:
          - os: ubuntu-latest
            pwsh: '7.6.6'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PowerShell ${{ matrix.pwsh }}
        uses: ./.github/actions/install-pwsh
        with:
          version: ${{ matrix.pwsh }}
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Bootstrap -Task Build
      - name: Repeated test runs
        shell: pwsh
        run: ./tools/repro/Invoke-Issue7Repro.ps1 -Iterations 30
      - name: Timeout sweep
        if: always()
        shell: pwsh
        run: ./tools/repro/Invoke-Issue7Sweep.ps1
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-${{ matrix.os }}-pwsh${{ matrix.pwsh }}
          path: output/repro/
          if-no-files-found: warn
